    <!--
      THEME FLASH PREVENTION
      This script runs synchronously before React hydrates, reading the
      saved theme from localStorage and applying [data-theme] to <html>
      immediately. This prevents any white/dark flash on page load/refresh.
    -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('vite-ui-theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
